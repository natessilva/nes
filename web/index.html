<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wasm</title>
    <style>
      .container {
        width: 90%;
        margin: auto;
        image-rendering: crisp-edges;
      }

      canvas {
        width: 100%;
      }
    </style>
    <script src="wasm_exec.js"></script>
  </head>

  <body>
    <div>
      <input type="file" id="file" />
    </div>
    <div class="container">
      <canvas id="canvas" width="256" height="240"></canvas>
    </div>
    <script>
      let audioCtx = null;
      let nextPlayTime = 0;
      const SAMPLE_RATE = 44100;

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
        nextPlayTime = 0;
      }

      function queueAudio(uint8Array, sampleCount) {
        if (!audioCtx || sampleCount === 0) return;
        const floats = new Float32Array(uint8Array.buffer, 0, sampleCount);
        const audioBuffer = audioCtx.createBuffer(1, sampleCount, SAMPLE_RATE);
        audioBuffer.getChannelData(0).set(floats);
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        if (nextPlayTime < audioCtx.currentTime) {
          nextPlayTime = audioCtx.currentTime + 2 / 60;
        }
        source.start(nextPlayTime);
        nextPlayTime += sampleCount / SAMPLE_RATE;
      }

      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("nes.wasm"), go.importObject).then(
        (result) => {
          go.run(result.instance);
        }
      );

      document.querySelector("#file").addEventListener(
        "change",
        function () {
          const reader = new FileReader();
          reader.onload = function () {
            // Converting the image to Unit8Array
            const arrayBuffer = this.result,
              array = new Uint8Array(arrayBuffer);
            // Call wasm exported function
            const txt = loadROM(array);
          };
          reader.readAsArrayBuffer(this.files[0]);
        },
        false
      );

      document.addEventListener("keydown", (event) => {
        if (keydown && keydown(event.key)) {
          event.preventDefault();
          event.stopPropagation();
        }
      });

      document.addEventListener("keyup", (event) => {
        if (keyup && keyup(event.key)) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </body>
</html>
